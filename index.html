<!DOCTYPE html>
<html lang="bg" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasksFlow App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">

        <main class="todo-card">

            <header class="header">
                <div class="header-title">
                    <h1>TasksFlow</h1>
                    <p class="subtitle" id="current-date">Днешен преглед</p>
                </div>
                <div class="header-right-controls">
                    <button id="lang-toggle-btn" onclick="toggleLanguage()" title="Switch Language / Смени език">
                        <span id="lang-label">EN</span>
                        <img src="./images/icon-earth.png" width="15" height="15" alt="">
                    </button>
                    <div class="header-icon">
                        <img id="calendar" src="./images/schedule.png" alt="schedule">
                    </div>
                </div>
            </header>

            <section class="progress-section">
                <div class="progress-info">
                    <span data-translate="progress-title">Изпълнение на задачите</span>
                    <strong id="progress-percent">0%</strong>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </section>

            <section class="input-section" id="input-section">
                <div class="input-group">
                    <img src="./images/add.png" width="14" height="14" alt="">
                    <input type="text" id="input-box" data-translate-placeholder="input-placeholder" placeholder="Какво трябва да се направи?" autocomplete="off">

                    <div class="input-controls">
                        <input type="text" id="topic-box" list="topic-list" data-translate-placeholder="topic-placeholder" placeholder="Категория (по избор)" autocomplete="off" maxlength="30">
                        <datalist id="topic-list"></datalist>

                        <select id="priority-select" title="Приоритет">
                            <option value="low" selected data-translate="opt-low">Нисък</option>
                            <option value="medium" data-translate="opt-medium">Среден</option>
                            <option value="high" data-translate="opt-high">Висок</option>
                        </select>

                        <div class="date-picker-wrapper" data-translate-title="due-date-title" title="Краен срок">
                            <img src="./images/calendar-solid.png" width="15" height="15" alt="">
                            <input type="date" id="date-box">
                        </div>

                        <button id="add-btn" onclick="addTask()">
                            <span data-translate="btn-add">Добави</span>
                        </button>
                    </div>
                </div>
            </section>

            <nav class="tab-buttons">
                <button id="tab-active" class="tab-btn active" onclick="switchTab('active')">
                    <img src="./images/file-list.png" width="30" height="30" alt=""> <span data-translate="tab-active">Активни</span> (<span id="active-count">0</span>)
                </button>
                <button id="tab-history" class="tab-btn" onclick="switchTab('history')">
                    <img src="./images/archive.png" width="30" height="30" alt=""> <span data-translate="tab-history">Архив</span> (<span id="history-count">0</span>)
                </button>
            </nav>

            <div class="drag-hint">
                <img src="./images/double-arrow.png" width="24" height="24" style="opacity: 0.4" alt="">
                <span data-translate="drag-hint">
                </span>
            </div>

            <ul id="list-container" class="task-list active-view"></ul>
            <ul id="history-container" class="task-list hidden-view"></ul>

            
            <div class="pages-bar" id="pages-bar">
                <button type="button" id="page-prev" onclick="goToPage(pages[activeTab] - 1)">&lsaquo;</button>
                <span id="pages-info">1 / 1</span>
                <button type="button" id="page-next" onclick="goToPage(pages[activeTab] + 1)">&rsaquo;</button>
            </div>

            <footer class="card-footer">
                <button id="clear-all" onclick="clearData()">
                    <img src="./images/red-trashcan.png" width="15" height="15" alt="">
                    <span data-translate="btn-clear">Изчисти всичко</span>
                </button>
            </footer>

        </main>

        <aside class="music-player minimized" id="music-player-card">

            <div id="playlist-input-container" style="display: none; padding: 10px; background: #f8fafc; border-bottom: 1px solid #f1f5f9; gap: 6px; align-items: center;">
                <input type="text" id="playlist-url-input" data-translate-placeholder="playlist-placeholder" placeholder="Paste Spotify link...">
                <button onclick="saveNewPlaylist()" style="background: #6366f1; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600;">OK</button>
            </div>

            <div class="player-header">
                <span data-translate="player-title">Плейлист</span>

                <div style="display: flex; gap: 4px; align-items: center;">
                    <div id="playlist-hint" class="playlist-hint" onclick="togglePlayer()">
                        <span data-translate="playlist-hint-text">Искаш ли да слушаш любимата си музика, кликни тук</span>
                        <span class="playlist-hint-arrow">&rarr;</span>
                    </div>

                    <button id="change-playlist-btn" onclick="promptPlaylistChange()" title="Смени плейлиста / Change Playlist" style="background: transparent; border: none; cursor: pointer; color: #64748b; font-size: 12px; display: none; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px;">
                        <img src="./images/gear.png" width="15" height="15" alt="">
                    </button>
                    <button id="toggle-player-btn" onclick="togglePlayer()" data-translate-title="player-toggle-title" title="Минимизиране / Разширяване">
                        <img src="./images/toggle_expand_hide.png" width="15" height="15" alt="">
                    </button>
                </div>
            </div>

            <div class="player-body" id="player-body">
                <iframe
                    id="spotify-iframe"
                    data-testid="embed-iframe"
                    src="https://open.spotify.com/embed/playlist/1a2SgCK2DuQdqsXnhplZB0?utm_source=generator&si=1ed5c0958b334391"
                    frameBorder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>
            </div>
        </aside>

        <div id="edit-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <header class="modal-header">
                    <h3 data-translate="modal-title">Редактиране на задача</h3>
                    <button onclick="closeEditModal()" class="close-btn">&times;</button>
                </header>
                <div class="modal-body">
                    <div class="edit-form-group">
                        <label for="edit-text-input" data-translate="modal-label-title">Заглавие:</label>
                        <input type="text" id="edit-text-input">
                    </div>
                    
                    <div class="edit-form-group">
                        <label for="edit-topic-input" data-translate="modal-label-topic">Категория:</label>
                        <input type="text" id="edit-topic-input" list="topic-list" maxlength="30" autocomplete="off">
                    </div>
                    <div class="edit-form-group">
                        <label for="edit-priority-select" data-translate="modal-label-priority">Приоритет:</label>
                        <select id="edit-priority-select">
                            <option value="low" data-translate="opt-low">Нисък</option>
                            <option value="medium" data-translate="opt-medium">Среден</option>
                            <option value="high" data-translate="opt-high">Висок</option>
                        </select>
                    </div>
                    <div class="edit-form-group">
                        <label for="edit-date-input" data-translate="modal-label-date">Краен срок:</label>
                        <input type="date" id="edit-date-input">
                    </div>
                    <div class="modal-actions">
                        <button onclick="closeEditModal()" class="btn-cancel" data-translate="btn-cancel">Отказ</button>
                        <button onclick="saveTaskEdit()" class="btn-save" data-translate="btn-save">Запази</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="toast-container"></div>

        
        <div id="delete-confirm-modal" class="modal-overlay hidden">
            <div class="confirm-dialog-box">
                <div class="confirm-dialog-icon">
                    <img src="./images/alert.png" width="36" height="36" alt="Warning">
                </div>
                <p id="delete-confirm-text" class="confirm-dialog-text"></p>
                <div class="confirm-dialog-actions">
                    <button type="button" id="btn-confirm-no" class="btn-confirm-no"></button>
                    <button type="button" id="btn-confirm-yes" class="btn-confirm-yes"></button>
                </div>
            </div>
        </div>

        
        <div id="clear-confirm-modal" class="modal-overlay hidden">
            <div class="confirm-dialog-box">
                <div class="confirm-dialog-icon">
                    <img src="./images/alert.png" width="36" height="36" alt="Warning">
                </div>
                <p id="clear-confirm-text" class="confirm-dialog-text"></p>
                <div class="confirm-dialog-actions">
                    <button type="button" id="btn-clear-no" class="btn-confirm-no"></button>
                    <button type="button" id="btn-clear-yes" class="btn-confirm-yes"></button>
                </div>
            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
